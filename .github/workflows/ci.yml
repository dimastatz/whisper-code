name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint (type-aware)
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: npm audit (runtime deps)
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Tests (coverage >= 95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests with coverage gate
        run: xvfb-run -a npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: [static-analysis, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes @vscode/vsce package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
